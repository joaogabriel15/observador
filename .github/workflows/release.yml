name: release

# Gera os binários únicos (sem Python, sem dependências) quando uma tag v* é enviada.
# Também pode ser disparado à mão para só compilar e baixar os artefatos.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Versão a publicar (ex.: v0.2.0). Vazio: só compila e guarda os artefatos."
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: observador
            asset: observador-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: observador.exe
            asset: observador-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - name: Alvo de compilação
        run: rustup target add ${{ matrix.target }}
      - name: Linux estático (musl)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Compilar
        run: cargo build --release --target ${{ matrix.target }}
      - name: Teste rápido do binário
        shell: bash
        run: |
          mkdir -p smoke && echo '{"role":"user","content":"errado, de novo isso"}' > smoke/a.jsonl
          ./target/${{ matrix.target }}/release/${{ matrix.bin }} scan smoke
      - name: Separar o arquivo
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Somas de verificação e publicação
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          gh release create "${TAG}" * --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "${TAG}" \
            --notes "Binários únicos para Linux (x86_64, estático) e Windows (x86_64). Sem Python e sem dependências."
